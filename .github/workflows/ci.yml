name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Checks (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 20
          - os: macos-latest
            node: 20
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install MCP server dependencies
        run: npm ci --ignore-scripts

      - name: Check committed Skill runtime matches source and lockfile
        run: npm run check:skill

      - name: Run unit and contract tests
        run: npm test

      - name: Run TypeScript lint check
        run: npm run lint

      - name: Check fixture scripts
        shell: bash
        run: |
          node --check examples/fixture/main.cjs
          node --check examples/fixture/preload.cjs
          node --check examples/fixture/renderer.js
          node --check examples/fixture/smoke.mjs
          node --check examples/fixture/mcp-smoke.mjs
          node --check examples/fixture/ci-smoke.mjs
          node --check examples/fixture/blocked-smoke.mjs
          node --check examples/fixture/lifecycle-smoke.mjs
          node --check examples/fixture/utility.cjs
          node --check examples/fixture/utility-smoke.mjs
          node --check examples/fixture/inspection-smoke.mjs
          node --check examples/fixture/test-support.mjs
          node --check examples/fixture/smoke-assertions.mjs
          node --check examples/fixture/package-smoke.mjs
          node --check scripts/build-skill.mjs
          node --check scripts/run-tests.mjs
          node --check scripts/skill-launcher.cjs
          node --check examples/external-e2e/electron-vite-react-smoke.mjs
          node --check examples/host-e2e/smoke.mjs
          node --check examples/host-e2e/mcp-trace.mjs
          node --check examples/host-e2e/scenarios.mjs
          node --check examples/host-e2e/fixture-launch.mjs
          node --check examples/host-e2e/reference.mjs
          node --check examples/field-app/main.mjs
          node --check examples/field-app/preload.cjs
          node --check examples/field-app/renderer.js
          node --check examples/field-app/field-launch.mjs
          node --check examples/field-app/field-smoke.mjs

      - name: Install fixture dependencies
        run: npm ci --prefix examples/fixture

      - name: Run real Electron fixture smoke on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node examples/fixture/package-smoke.mjs
        env:
          FIXTURE_ELECTRON_NO_SANDBOX: "true"

      - name: Run real Electron fixture smoke on Windows and macOS
        if: runner.os != 'Linux'
        run: node examples/fixture/package-smoke.mjs

  electron-versions:
    # The utility channel relies on the undocumented process._debugProcess, and evaluate retries on V8 error wording.
    # Both can change between Electron majors, so run the real-Electron smokes against every supported major.
    name: Electron ${{ matrix.electron }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        electron: ["43", "44", latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Build the MCP server
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Install fixture dependencies with the Electron version under test
        run: |
          npm ci --prefix examples/fixture
          npm install --no-save --prefix examples/fixture electron@${{ matrix.electron }}
          node -e "console.log('Electron ' + require('./examples/fixture/node_modules/electron/package.json').version)"

      - name: Run utility, inspection and field smokes on Linux
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a node examples/fixture/utility-smoke.mjs
          xvfb-run -a node examples/fixture/inspection-smoke.mjs
          xvfb-run -a node examples/field-app/field-smoke.mjs
        env:
          FIXTURE_ELECTRON_NO_SANDBOX: "true"

      - name: Run utility, inspection and field smokes on Windows
        if: runner.os != 'Linux'
        run: |
          node examples/fixture/utility-smoke.mjs
          node examples/fixture/inspection-smoke.mjs
          node examples/field-app/field-smoke.mjs
