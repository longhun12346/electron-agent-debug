name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 20
          - os: macos-latest
            node: 20
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install MCP server dependencies
        run: npm ci --ignore-scripts

      - name: Check committed Skill runtime matches source and lockfile
        run: npm run check:skill

      - name: Run unit and contract tests
        run: npm test

      - name: Run TypeScript lint check
        run: npm run lint

      - name: Check example and build scripts
        shell: bash
        run: |
          for file in scripts/*.mjs scripts/*.cjs examples/external-e2e/*.mjs examples/host-e2e/*.mjs \
            examples/vue-vite-app/*.mjs examples/vue-vite-app/scenarios/*.mjs; do
            node --check "$file"
          done

      - name: Install the Vue + Vite example dependencies
        run: npm ci --prefix examples/vue-vite-app

      # A Vue 3 + Vite app through the electron-vite dev server and its build output, against a copy of the Skill in a
      # folder with spaces in its name: hot updates, a main-process restart, typical faults, a utility process, several
      # windows, a crashed page, inspection, clicking and typing, restart on new ports.
      - name: Run the Vue + Vite example smoke on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node examples/vue-vite-app/package-smoke.mjs
        env:
          TEST_ELECTRON_NO_SANDBOX: "true"

      - name: Run the Vue + Vite example smoke on Windows and macOS
        if: runner.os != 'Linux'
        run: node examples/vue-vite-app/package-smoke.mjs

      # The scripted reference solutions of the host scenarios, replayed without a model against the same app.
      - name: Replay the host scenarios' reference solutions on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node examples/host-e2e/reference.mjs
        env:
          TEST_ELECTRON_NO_SANDBOX: "true"

      - name: Replay the host scenarios' reference solutions on Windows and macOS
        if: runner.os != 'Linux'
        run: node examples/host-e2e/reference.mjs

  electron-versions:
    # The utility channel relies on the undocumented process._debugProcess, and evaluate retries on V8 error wording.
    # Both can change between Electron majors, so run the real-Electron smokes against every supported major.
    name: Electron ${{ matrix.electron }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        electron: ["43", "44", latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Build the MCP server
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Install the Vue + Vite example with the Electron version under test
        run: |
          npm ci --prefix examples/vue-vite-app
          npm install --no-save --prefix examples/vue-vite-app electron@${{ matrix.electron }}
          node -e "console.log('Electron ' + require('./examples/vue-vite-app/node_modules/electron/package.json').version)"

      - name: Run utility, inspection, interaction, window and crash scenarios on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node examples/vue-vite-app/smoke.mjs utility inspection interaction windows crash-and-exit
        env:
          TEST_ELECTRON_NO_SANDBOX: "true"

      - name: Run utility, inspection, interaction, window and crash scenarios on Windows
        if: runner.os != 'Linux'
        run: node examples/vue-vite-app/smoke.mjs utility inspection interaction windows crash-and-exit
