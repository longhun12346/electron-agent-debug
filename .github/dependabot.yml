version: 2

# Pull requests that change the root dependencies or the GitHub Actions also change what `npm run build:skill` bundles
# or what the workflows run, so they need the regenerated skill/electron-debug/runtime files before `check:skill` passes.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"

  # A Vue 3 + Vite app through electron-vite. Its Electron version is what the real-Electron smokes run against by default.
  - package-ecosystem: npm
    directory: /examples/vue-vite-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
