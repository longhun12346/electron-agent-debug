<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="420" rx="14" fill="url(#bg)"/>

  <!-- Title -->
  <text x="32" y="38" fill="#f8fafc" font-size="18" font-weight="700">electron-agent-debug — Attach-Only Tri-Channel Diagnostics &amp; JS-to-Native Flow</text>
  <text x="32" y="58" fill="#94a3b8" font-size="12">10 lightweight MCP tools · 1 shared seq timeline · Node.js 20+ zero-install runtime</text>

  <!-- Left: Coding Agent -->
  <rect x="32" y="92" width="175" height="190" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="119" y="120" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">Coding Agent</text>
  <text x="119" y="140" text-anchor="middle" fill="#cbd5e1" font-size="11">Claude Code / Codex / pi</text>
  <rect x="48" y="156" width="143" height="52" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="119" y="176" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">electron-debug Skill</text>
  <text x="119" y="194" text-anchor="middle" fill="#94a3b8" font-size="10">Workflow · Evidence Matrix</text>
  <rect x="48" y="218" width="143" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="119" y="238" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Starts App Directly</text>
  <text x="119" y="255" text-anchor="middle" fill="#94a3b8" font-size="10">pnpm dev + debug flags</text>

  <!-- Arrow Agent <-> MCP -->
  <line x1="207" y1="187" x2="262" y2="187" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)" marker-start="url(#arrow-cyan)"/>
  <text x="235" y="177" text-anchor="middle" fill="#38bdf8" font-size="10">stdio MCP</text>
  <text x="235" y="203" text-anchor="middle" fill="#64748b" font-size="9">or --run</text>

  <!-- Center: MCP Server -->
  <rect x="268" y="92" width="236" height="190" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="386" y="118" text-anchor="middle" fill="#a5b4fc" font-size="14" font-weight="700">electron-agent-debug MCP</text>
  <text x="386" y="136" text-anchor="middle" fill="#94a3b8" font-size="10.5">Loopback only · Bounded output · 10 tools</text>

  <!-- Unified Timeline Box -->
  <rect x="284" y="150" width="204" height="58" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
  <text x="386" y="170" text-anchor="middle" fill="#e0e7ff" font-size="11.5" font-weight="600">Unified Event Timeline (seq)</text>
  <text x="386" y="187" text-anchor="middle" fill="#94a3b8" font-size="10">click() → afterSeq=42 → aligns</text>
  <text x="386" y="200" text-anchor="middle" fill="#94a3b8" font-size="10">Main IPC + Renderer + Utility logs</text>

  <!-- Tools summary -->
  <rect x="284" y="218" width="204" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="386" y="236" text-anchor="middle" fill="#cbd5e1" font-size="10">attach · targets · status · logs · wait_for</text>
  <text x="386" y="254" text-anchor="middle" fill="#cbd5e1" font-size="10">evaluate · screenshot · dom_snapshot · click · type</text>

  <!-- Right: Running Electron App -->
  <rect x="572" y="92" width="316" height="190" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="730" y="118" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">Running Local Electron App</text>

  <!-- Channel 1: Main -->
  <rect x="590" y="132" width="280" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="604" y="150" fill="#f8fafc" font-size="11.5" font-weight="600">Main Process</text>
  <text x="604" y="164" fill="#94a3b8" font-size="10">Node Inspector (--inspect) · IPC · koffi/.node</text>

  <!-- Channel 2: Renderer -->
  <rect x="590" y="180" width="280" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="604" y="198" fill="#f8fafc" font-size="11.5" font-weight="600">Renderer Process</text>
  <text x="604" y="212" fill="#94a3b8" font-size="10">CDP (--remote-debugging-port) · DOM · AX Tree</text>

  <!-- Channel 3: Utility -->
  <rect x="590" y="228" width="280" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="604" y="246" fill="#f8fafc" font-size="11.5" font-weight="600">Utility Process (Optional)</text>
  <text x="604" y="260" fill="#94a3b8" font-size="10">On-demand attach via Main (serviceName / pid)</text>

  <!-- Arrows MCP -> Electron Channels -->
  <line x1="504" y1="152" x2="584" y2="152" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="504" y1="200" x2="584" y2="200" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="504" y1="248" x2="584" y2="248" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Bottom: Native Debugging Escalation -->
  <rect x="32" y="316" width="856" height="74" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="52" y="342" fill="#fbbf24" font-size="13" font-weight="700">Native Module Escalation (koffi / .node)</text>
  <text x="52" y="362" fill="#cbd5e1" font-size="11">1. Leave JS-side evidence (afterSeq, main pid, args)   →   2. Attach WinDbg/cdb (Windows) or gdb/lldb (Linux/macOS) with user consent</text>
  <text x="52" y="379" fill="#94a3b8" font-size="10.5">3. Break in C/C++/Rust source, inspect stack &amp; raw bytes   →   4. Patch, rebuild, restart, re-attach &amp; verify</text>

  <!-- Escalation arrow from Main Process down to Native box -->
  <line x1="730" y1="282" x2="730" y2="312" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>
</svg>
