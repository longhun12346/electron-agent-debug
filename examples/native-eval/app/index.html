<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Native Eval</title>
  </head>
  <body>
    <h1>Native Eval</h1>
    <p>Worker slots: <output id="slots">?</output></p>
    <label>Folder <input id="dir" aria-label="Folder" size="48" /></label>
    <label>Subfolder <input id="name" aria-label="Subfolder" size="16" /></label>
    <p>
      <button id="sum">Sum sizes</button>
      <button id="find">Find subfolder</button>
    </p>
    <p>Result: <output id="result">-</output></p>
    <script src="renderer.js"></script>
  </body>
</html>
