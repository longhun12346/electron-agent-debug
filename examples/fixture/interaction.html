<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Interaction Fixture</title>
  </head>
  <body>
    <main>
      <button id="save" type="button">Save</button>
      <button id="disabled" type="button" disabled>Locked</button>
      <button id="covered" type="button">Covered</button>
      <div id="overlay" style="position: fixed; left: 0; top: 0; width: 100%; height: 0; background: rgba(0, 0, 0, 0.2)"></div>
      <label>Name <input id="name" /></label>
      <input id="controlled" aria-label="Controlled" />
      <form id="search-form"><input id="search" type="search" aria-label="Search" /></form>
      <div id="spacer" style="height: 2000px"></div>
      <button id="far" type="button">Far away</button>
      <p id="events">none</p>
    </main>
    <script src="./interaction.js"></script>
  </body>
</html>
